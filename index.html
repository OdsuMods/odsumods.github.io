<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'JetBrains Mono', monospace;
}

body{
    background:#090909;
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    border-bottom:1px solid #333;
}

header h1{
    color:#b76cff;
    font-size:28px;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:40px;
}

.topbar{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

input{
    flex:1;
    background:#111;
    border:1px solid #444;
    color:white;
    padding:12px;
    outline:none;
}

button{
    background:transparent;
    color:#b76cff;
    border:1px solid #b76cff;
    padding:12px 20px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#b76cff;
    color:black;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border:1px solid #333;
    padding:20px;
    transition:.2s;
}

.card:hover{
    border-color:#b76cff;
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    margin-bottom:15px;
}

.card h2{
    color:#b76cff;
    margin-bottom:10px;
}

.card p{
    color:#bbb;
    margin-bottom:15px;
}

.download{
    display:inline-block;
    text-decoration:none;
    color:#b76cff;
    border:1px solid #b76cff;
    padding:10px 15px;
    transition:.2s;
}

.download:hover{
    background:#b76cff;
    color:black;
}
</style>
</head>
<body>

<header>
<h1>My Applications</h1>
</header>

<div class="container">

<div class="topbar">
<input type="text" id="search" placeholder="Search applications...">
<button onclick="filterApps()">Search</button>
</div>

<div id="apps" class="grid"></div>

</div>

<script>
let apps=[];

fetch("apps.json")
.then(r=>r.json())
.then(data=>{
    apps=data;
    display(apps);
});

function display(list){

    const container=document.getElementById("apps");
    container.innerHTML="";

    list.forEach(app=>{

        container.innerHTML+=`
        <div class="card">
            <img src="${app.image}" alt="">
            <h2>${app.name}</h2>
            <p>${app.description}</p>
            <p><strong>Version:</strong> ${app.version}</p>
            <a class="download" href="${app.download}" download>Download</a>
        </div>
        `;

    });

}

function filterApps(){

    const value=document.getElementById("search").value.toLowerCase();

    display(
        apps.filter(app=>
            app.name.toLowerCase().includes(value) ||
            app.description.toLowerCase().includes(value)
        )
    );

}
</script>

</body>
</html>
