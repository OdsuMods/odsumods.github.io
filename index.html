<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'JetBrains Mono',monospace;
}

body{
    background:#090909;
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    border-bottom:1px solid #333;
}

header h1{
    color:#b76cff;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:40px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#111;
    border:1px solid #444;
    color:white;
}

button{
    background:transparent;
    color:#b76cff;
    border:1px solid #b76cff;
    padding:10px 20px;
    cursor:pointer;
}

button:hover{
    background:#b76cff;
    color:black;
}

#login{
    max-width:400px;
    margin:100px auto;
    background:#111;
    padding:30px;
    border:1px solid #333;
}

#site{
    display:none;
}

#adminPanel{
    display:none;
    margin-bottom:25px;
    padding:20px;
    border:1px solid #b76cff;
    background:#141414;
}

.topbar{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border:1px solid #333;
    padding:20px;
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    margin-bottom:15px;
}

.card h2{
    color:#b76cff;
    margin-bottom:10px;
}

.download{
    display:inline-block;
    margin-top:10px;
    text-decoration:none;
    color:#b76cff;
    border:1px solid #b76cff;
    padding:10px 15px;
}
</style>
</head>
<body>

<div id="login">

<h2>Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="status"></p>

</div>

<div id="site">

<header>

<h1>My Applications</h1>

<div id="welcome"></div>

</header>

<div class="container">

<div id="adminPanel">

<h2>Admin Panel</h2>

<p>You are an administrator.</p>

<button onclick="alert('Add your upload page here.')">
Upload Application
</button>

</div>

<div class="topbar">

<input
id="search"
placeholder="Search..."
oninput="filterApps()">

</div>

<div id="apps" class="grid"></div>

</div>

</div>

<script>

let users=[];
let apps=[];

fetch("users.json")
.then(r=>r.json())
.then(data=>users=data.users);

fetch("apps.json")
.then(r=>r.json())
.then(data=>{
    apps=data;
});

function login(){

    const username=document.getElementById("username").value;
    const password=document.getElementById("password").value;

    const user=users.find(u=>
        u.username===username &&
        u.password===password
    );

    if(!user){
        document.getElementById("status").innerText="Invalid login.";
        return;
    }

    if(!user.verified){
        document.getElementById("status").innerText="Account awaiting verification.";
        return;
    }

    document.getElementById("login").style.display="none";
    document.getElementById("site").style.display="block";

    document.getElementById("welcome").innerText=
        "Welcome, "+user.username;

    if(user.admin){
        document.getElementById("adminPanel").style.display="block";
    }

    display(apps);

}

function display(list){

    const container=document.getElementById("apps");

    container.innerHTML="";

    list.forEach(app=>{

        container.innerHTML+=`
        <div class="card">
            <img src="${app.image}">
            <h2>${app.name}</h2>
            <p>${app.description}</p>
            <p>Version: ${app.version}</p>
            <a class="download" href="${app.download}" download>
                Download
            </a>
        </div>
        `;

    });

}

function filterApps(){

    const search=document
        .getElementById("search")
        .value
        .toLowerCase();

    display(apps.filter(app=>

        app.name.toLowerCase().includes(search) ||

        app.description.toLowerCase().includes(search)

    ));

}

</script>

</body>
</html>
